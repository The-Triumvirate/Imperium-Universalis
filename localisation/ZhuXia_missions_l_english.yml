 wuu_sunwujungai_tier_tt:0 "Unlock the special §MArt of War Doctrine Set§!"
 flavor_wuu.1.t:0 "The legendary art book The Art of War discovered during the siege!"
 flavor_wuu.1.d:0 "Our soldiers have unearthed the legendary art book of military strategy during the siege! How shall we handle it? We must consider carefully!"
 flavor_wuu.1.a:0 "Bring it back to the capital!"
 flavor_wuu.1.b:0 "Burn it!"
 flavor_wuu.1.c:0 "Do nothing to honor the sages"
 flavor_wuu.2.t:0 "The Art of War has been stolen!"
 flavor_wuu.2.d:0 "A grave dishonor! The enemy plundered the sacred military treatise after capturing the city!"
 flavor_wuu.2.a:0 "How outrageous! A terrible humiliation!"
 tripitaka_wuu_tt.1:0 "§YYou have seized The Art of War!§!"
 tripitaka_wuu_tt.2:0 "§RThe Art of War was burned!§!"
 tripitaka_wuu_tt.3:0 "§GThe Art of War remains intact.§!"
 tripitaka_wuu_tt.4:0 "§RThe Art of War was seized by the enemy!§!"
 yue_xishi_tier_tt:0 "Choose the fate of the beauty Xi Shi"
 flavor_yue.1.t:0 "The fate of Xi Shi"
 flavor_yue.1.d:0 "We have been defeated by Wu! Our king is besieged on Kuaiji Mountain and our situation is dire! At this moment, the peerless beauty Xi Shi offers herself to King Wu to save Yue."
 flavor_yue.1.a:0 "Present her to King Wu to plead for our nation’s survival"
 flavor_yue.1.b:0 "Xi Shi is mine!"
 flavor_yue.1.c:0 "Spare the poor beauty, grant her freedom."
 flavor_wuu.3.t:0 "Submit or Perish! Yue Offers Beauty Xi Shi"
 flavor_wuu.3.d:0 "The State of Yue offers the unparalleled beauty Xi Shi along with gold, silver, and jewels, kneeling before you and begging for surrender!"
 flavor_wuu.3.a:0 "Claim the beauty for myself!"
 flavor_wuu.3.b:0 "See through the Beauty Stratagem!"
 xishi_wuu_tt.42:0 "§MYou wed the peerless Xi Shi in the bridal chamber§!"
 flavor_wuu.4.t:0 "Marriage to Xi Shi"
 flavor_wuu.4.d:0 "You bring Xi Shi to the capital and wed this Spring and Autumn era’s greatest beauty. You feel unmatched fulfillment: both realm and beauty are yours to cherish!"
 flavor_wuu.4.a:0 "Xi Shi is officially mine!"
 xishi_wuu_tt.43:0 "§MBy demarcating the Zhe River, Wu and Yue coexist; Yue survives as a vassal§!"
 xishi_tt.3:0 "Offer the beauty Xi Shi to the King of Wu, pleading for vassalage in order to preserve the State of Yue."
 yue_woxinchangdan_modifier:0 "Perseverance on Firewood and Gall"
 yue_fuxing_modifier:0 "Revive Yue"
 xishi_yue_tt.2:0 "§OXi Shi grants +1 to all three stats for the current and heir characters§!"
