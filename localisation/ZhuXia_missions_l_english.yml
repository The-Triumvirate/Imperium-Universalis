 zho_1_zaiceguogong_title:0 "Restore Guo Gong"
 zho_1_zaiceguogong_desc:0 "The state of Guo was once a loyal and stalwart vassal to the Zhou kings. We must restore them and their dukes to act as our vanguard!"
 zho_1_fanhuizongzhou_title:0 "Return to Zongzhou"
 zho_1_fanhuizongzhou_desc:0 "Though the Quanrong destroyed Haojing and King Ping moved east over a hundred years ago, the ancestral tombs still exist in our former heartland - we must return!"
 zho_1_xiyoukuangye_title:0 "Western Wilderness"
 zho_1_xiyoukuangye_desc:0 "In the past, King Xuan traveled to the western fringes of the world  and met the Queen Mother of the West - our king must also send troops to visit her."
