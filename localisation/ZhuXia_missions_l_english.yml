 ShiJian.46.t:0 "Jin Reminds us of the Death of King Xie"
 ShiJian.46.d:0 "At the beginning of the Spring and Autumn period, there were two rival claimants to the Zhou throne. One was king Ping, supported by Shen, who is the ancestor to the current monarchical line. The other was king Xie, supported by Guo. Duke Wen of Jin killed king Xie in 750 BC, thus giving us uncontested control of the crown. Jin has come to us to reiterate this deed. Of course, their underlaying message is that they want us to cease any potental ambition we may harbor and align ourselves closer to the Marquess of Jin."
 ShiJian.46.a:0 "[JIN.Monarch.GetName] is a loyalist, their hegemony should be continued."
 ShiJian.46.b:0 "[JIN.Monarch.GetName] is attempting to usurp royal authority. Their hegemony cannot continue!"
 ShiJian.47.t:0 "Jin's Recent Conquests"
 ShiJian.47.d:0 "Over the past 60 or so years, Jin has launched many wars against the states around them, such as Guo, Yu, Wen, and Yong. Many of these states shared the surname Ji, the royal Zhou surname which Jin also has. Thus, their wars have been condemned by some. The Marquess of Jin has sent a petition to us requesting that we officially recognize their conquests as legitimate."
 ShiJian.47.a:0 "We recognize Jin's conquests as necessary to protect Us."
 ShiJian.47.b:0 "Those were brotherly states to Jin, we can never accept this!"
 ShiJian.48.t:0 "Jin Sends Troops against our Rebels"
 ShiJian.48.d:0 "Seeing that we are facing rebellion in our royal domain, Jin has sent their armies to swiftly quash the pretenders, restoring order to the court."
 ShiJian.48.a:0 "The Court must have it's independence!"
 ShiJian.48.b:0 "Great!"
 ShiJian.49.t:0 "Jin Helps Us to Civilize"
 ShiJian.49.d:0 "The great state of Jin has sent numerous envoys to our court recently, desiring to establish a connection with us and seeking our help against Chu. No doubt we must build up this budding relationship and use this assisstance to defeat Chu!"
 ShiJian.49.a:0 "Good!"
 #Zhou Missions
 zho_1_jisisongyue_title:0 "Sacrifices to Mount Song"
 zho_1_jisisongyue_desc:0 "The Song mountains are high,\ntheir summits touch the sky.\nTheir spirits come on earth,\nto Fu and Shen gave birth.\nThe Shen State and Fu State,\nare Zhou's bulwarks great.\nThey screen it from attack,\non the front and the back.\n\nMount Song is located near Luoyang, symbolizing the connection between the king and heaven. We should build a temple there to conduct grand sacrifices."

 zho_1_daxingnongshi_title:0 "Promote Agriculture"
 zho_1_daxingnongshi_desc:0 "The Zhou rulers of old once abandoned their former lands at Bin to take up agriculture at their new settlement of Qi. We should follow in their footsteps and emphasize agriculture once more."

 zho_1_shanzebanli_title:0 "Encourage Commerce"
 zho_1_shanzebanli_desc:0 "Although a country is nothing without the farmers, merchants are also important. Now that we have plentiful harvest, we should encourage commerce."

 zho_1_fanhuizongzhou_title:0 "Return to Zongzhou"
 zho_1_fanhuizongzhou_desc:0 "Though the Quanrong destroyed Fenghao and King Ping moved east over a hundred years ago, the ancestral tombs still exist in our former heartland - we must return!"

 zho_1_xiyoukuangye_title:0 "Western Wilderness"
 zho_1_xiyoukuangye_desc:0 "In the past, King Xuan traveled to the western fringes of the world  and met the Queen Mother of the West - our king must also send troops to visit her."

 zho_1_build_up_guanzhong_title:0 "Rebuild Guanzhong"
 zho_1_build_up_guanzhong_desc:0 "Guanzhong was the heartland and birthplace of our noble dynasty. Now that we've taken it back from Qin, we must develop it and restore it to its former glory."

 zho_1_rong_revenge_title:0 "Revenge on the Rong"
 zho_1_rong_revenge_desc:0 "The Rong have harassed Zhou even before its kingship! Now that Guanzhong is under our control, the nearby Rong must be put under our submission for good, lest the events on Mount Li repeat themselves."

 zho_2_caolianxinjun_title:0 "Drill New Army"
 zho_2_caolianxinjun_desc:0 "The Zhou Kings once commanded two military groups, one called the "Six Armies of the West" and the "Eight Armies of Chengzhou." Though ritual and etiquette are important, first and foremost we must have a strong military to enforce the royal command."

 zho_2_jianshefenghuo_title:0 "Build Fortifications"
 zho_2_jianshefenghuo_desc:0 "The Royal Capital must have sufficent fortifications so that the Son of Heaven and his direct subjects can be secure. This, combined with the area's natural defensibility, will make it very hard for rebellious lords to attack us."

 zho_2_restore_yuangong_title:0 "Restore Yuan Gong"
 zho_2_restore_yuangong_desc:0 "The state of Yuan was located close to the royal capital region, and protected us from Di attacks to the north. However, they were conquered by Jin in 635 BC. We should restore them to regain a strong and dependable ally."

 zho_1_zaiceguogong_title:0 "Restore Guo Gong"
 zho_1_zaiceguogong_desc:0 "The state of Guo was once a loyal and stalwart vassal to the Zhou kings. We must restore them so that they may once again act as our western vanguard!"

 zho_2_ensure_shenshou_title:0 "Ensure Shenshou"
 zho_2_ensure_shenshou_desc:0 "The spirits of the mountains and rivers have been neglected due to the turmoil over the past centuries. It is the duty of Heaven's son to ensure their sacrifices be properly and promptly conducted."

 zho_2_restore_fengjian_title:0 "Restore Fengjian"
 zho_2_restore_fengjian_desc:0 "O great is the Zhou State!\nWe climb up mountains high,\nto see hills undulate,\nflows the Yellow River by,\nbeneath the boundless sky,\nall which Zhou regulates.\n\n  - Book of Poetry"

 zho_3_gather_wise_men_title:0 "Recruit the Learned"
 zho_3_gather_wise_men_desc:0 "The foundation of a state is not merely built off the virtue of a king alone, but also by the use of talented ministers. Jiang Ziya was unrelated by blood but once served as the arms and legs of Zhou. Now, in this era of turmoil, we need the help of such people just as King Wen and Wu did when they fought against Shang."

 zho_3_tianwangenchong_title:0 "Reassert Authority"
 zho_3_tianwangenchong_desc:0 "Although we are no longer the masters of the world, the Zhou Son of Heaven is still respected as the progenitor of LiYue, and the head of the Ji lineage. This gives us the potential to regain some of our lost authority. First, we must ensure the Royal Capital is stable, and then launch an expedition against the Rong to our south who frequently raid us."

 zho_3_tianwangfadu_title:0 "Obtain Tribute"
 zho_3_tianwangfadu_desc:0 "The next step of regaining authority is to begin asking neighboring Zhuhou for tribute, thus displaying our position over them. However, the Bazhu is still strong, and won't agree to this without good relations."

 zho_3_zhoumingweixin_title:0 "Renew the Mandate"
 zho_3_zhoumingweixin_desc:0 "King Wen rests on high,\nhis spirit shines on through.\nThough Zhou is an old state,\nits destiny is renewed!\n\nWe can no longer sit idly by as the world continues in chaos around us. It is time for Zhou to strike out once more and pursue Heaven's decree!"

 zho_2_nanzhengdichu_title:0 "Strike Jingchu"
 zho_2_nanzhengdichu_desc:0 "King Zhao's southern expedition ended in disaster, with the six armies suffering decimation and the Son of Heaven losing his life! Now our king is reorganizing the army, and we should attack Chu to take revenge!"

 zho_3_become_bazhu_title:0 "Supersede the Hegemony"
 zho_3_become_bazhu_desc:0 "Our strength has grown to a level not seen since our clash with Shen and Zeng. A hegemon is no longer needed to "protect" us, we will take the position for ourselves!"

 zho_2_wangbajianzhi_title:0 "Eliminate BaDao"
 zho_2_wangbajianzhi_desc:0 "All those lords who would defy propriety shall be reformed or destroyed!"

 zho_4_tianwangzhanling_title:0 "Formalize War Orders"
 zho_4_tianwangzhanling_desc:0 "The Son of Heaven has, from time to time, called upon Huaxia to unite and resist barbarians who have threatened the world in the past, such as the Chidi during the time of Duke Huan of Qi, but these requests were informal and irregular. We should formalize a system to call upon the Zhuhou to resist the enemies of Huaxia."

 zho_3_zhouwangdongzheng_title:0 "Secure Zhongyuan"
 zho_3_zhouwangdongzheng_desc:0 "It is clear the Zhuhou will not willingly accept our new position. The only path forward is to bring them into the fold by force."

 zho_3_shimaiqibang_title:0 "Beyond Wen and Wu"
 zho_3_shimaiqibang_desc:0 "A progress through the state is done,\nO Heaven, bless your favored son!\nBless the Zhou House up and down!\nOur victory is so great,\nthat it shakes state to state.\nWe revere the gods forever,\nof mountain and of river,\nour king is worthy of the crown.\nZhou's House is bright and full of grace,\neach lord is in his proper place.\nWith spears and shields stored up in rows,\nand in their cases arrows and bows,\nthe king will do his best,\nto rule the kingdom east and west.\nO Heaven, may our king be blessed!\n\n  - Book of Poetry"

 zho_3_chongciqilv_title:0 "Eastern Expedition"
 zho_3_chongciqilv_desc:0 "With the Central Plains secure, we must affirm the suzerainty of the far-eastern states, just as the Duke of Zhou once did."

 zho_3_sushengongjian_title:0 "Tribute from Sushen"
 zho_3_sushengongjian_desc:0 "It is said that the Sushen people of the far northeast will pay tribute in arrows to a wise and virtuous lord. We must find them and obtain such tribute!"

 zho_4_tianwangzhixue_title:0 "Interstate Learning"
 zho_4_tianwangzhixue_desc:0 "The Zhuhou often bicker and fight one another, but through our mediation, we can encourage them to come together for the sake of ritual exercise and cultural learning."

 zho_4_taipinghuaiyi_title:0 "Crush the Huaiyi"
 zho_4_taipinghuaiyi_desc:0 "The Huaiyi have always been a thorn in our side. The time has come to reign them in."

 zho_4_xunqinjiangnan_title:0 "Kinsmen in Jiangnan"
 zho_4_xunqinjiangnan_desc:0 "Jiangnan is a far-flung place. We should enfeoff our relatives there to rule and enact our royal will."

 zho_2_yueshanglaigong_title:0 "Tribute from Yueshang"
 zho_2_yueshanglaigong_desc:0 "It is said that when the Duke of Zhou was in power, the Yueshang people of the far, far south came to present tribute through nine translators. Now, we're in contact with the Yueshang again, which is a sign of a well-governed world."

 zho_5_improve_chengzhou_title:0 "Glorify Chengzhou"
 zho_5_improve_chengzhou_desc:0 "Chengzhou is the heart of Zhou, and has been since the death of King You. Unfortunately, its splendor has been limited by civil war and conflicts with powerful Zhuhou. We must revitalize and glorify it, and make it the best city in the world!"
 zho_1_jisisongyue_mod:0 "Feng Cry at Mount Song"
 desc_zho_1_jisisongyue_mod:0 "After conducting sacrifices at Mount Song, some people claim to have heard the cries of a Fenghuang. This is reminiscent of a similar omen at the time of King Wen's receiving of the Mandate..."
 zho_1_daxingnongshi_mod:0 "Promoting Agriculture"
 desc_zho_1_daxingnongshi_mod:0 ""
 zho_2_chu_submission:0 "Forced Chu into Submission"
 desc_zho_2_chu_submission:0 "We have subdued the long-rebellious state of Chu."
 zhou_mission_rebuilding_gz:0 "Restoring the Local Economy"
 desc_zhou_mission_rebuilding_gz:0 "This region has been ravaged by war, and we are taking measures to improve it."
 zho_2_forever_fengjian:0 "Restored the Fengjian System"
 desc_zho_2_forever_fengjian:0 "We have reintroduced the Fengjian system and improved upon it, setting up loyal vassals throughout the world and restoring sacrifices to long-forgotten spirits and great ancestors of yore."
 zho_2_ensure_shenshou_mod:0 "Restored Shenshou States"
 desc_zho_2_ensure_shenshou_mod:0 "We have set up various Shenshou states across the world, ensuring that local spirits of mountains and rivers are receiving sacrifices."
 zho_1_shanzebanli_mod:0 "Encouraging Commerce"
 desc_zho_1_shanzebanli_mod:0 ""
 zho_3_sushen_tribute_mod:0 "Tribute from Sushen"
 desc_zho_3_sushen_tribute_mod:0 "We have received tribute from the Sushen of the far northeast, a splendid sign of a well-governed world."
 zho_1_xiyoukuangye.tt:0 "Every non-subject country with its capital in the Tarim Basin will be made our tributary."
 zho_2_caolianxinjun_mod:0 "Drilling Armies"
 desc_zho_2_caolianxinjun_mod:0 ""
 zho_2_jianshefenghuo_mod:0 "Building Fortifications"
 desc_zho_2_jianshefenghuo:0 ""
 zho_3_qingyou_claims_tt:0 "Gain a claim on all provinces in Youzhou and Qingzhou that you don't own."
 zho_1_rong_claims_tt:0 "Gain a claim on all provinces in Shuozhou and Liangzhou that you don't own."
 zho_2_wangbajianzhi_trigger_tt:0 "There must be no LiYue-BaDao countries within the China subcontinent."
 zho_2_nanzhengdichu.tt:0 "All non-vassal states in the Jingzhou region will become vassals of Zhou!"
 zho_2_yueshanglaigong.tt:0 "Every non-subject country with its capital in Jiaozhou or Nam Viet will be made our tributary."
 zho_3_tianwangenchong_tt:0 "Unlocks a diplomatic action which increases opinion of a LiYue-JiaoHua country in exchange for curia funds."
 zho_3_tianwangfadu_tt:0 "Zhou will unlock the decision to request Bi tribute from neighbors."
 zho_4_loyal_jiangnan_vassal:0 "Loyal Vassal"
 desc_zho_4_loyal_jiangnan_vassal:0 "We are loyally serving the Zhou Son of Heaven, our royal kin, in the far-flung south."
 zho_4_enfeoffed_jiangnan:0 "Enfeoffments in Jiangnan"
 desc_zho_4_enfeoffed_jiangnan:0 "Our vassals in Jiangnan bring us great prestige and exotic goods."
 zho_3_reasserting_authority_mod:0 "Reasserting Authority"
 desc_zho_3_reasserting_authority_mod:0 "For the first time in at least a hundred years, the Zhou king has gained enough authority to begin taking in interest in world affairs once more."
 zho_3_gather_wise_men_mod:0 "Recruiting Talented Officials"
 desc_zho_3_gather_wise_men_mod:0 "Our pursuit of talented officials is giving us a strategical edge over the Zhuhou."
 zho_3_zhoumingweixin_mod:0 "Renewed Mandate"
 desc_zho_3_zhoumingweixin_mod:0 "Although Zhou is an old state, its mandate is renewed!"
 zho_3_zhouwangdongzheng_modifier:0 "Awe-Inspiring Huaxia"
 desc_zho_3_zhouwangdongzheng_modifier:0 "We have brought much of the Central Plains to heel. All the other lords are in awe at our restored might!"
 zho_3_chongciqilv_modifier:0 "Restore Dongyuan"
 desc_zho_3_chongciqilv_modifier:0 "The king summoned the vassals from east of the mountains and commanded: 'East to the sea, west to the river, south to Muling, north to Yan Mountain; the nine Man and eight Yi tribes, follow me in the expedition.'"
 zho_3_sushengongjian.tt:0 "All non-vassal states in the Korea, Buyeo, and Sushen regions will become vassals of Zhou!"
 zho_4_tianwangzhanling_tt:0 "Zhou will unlock a new diplomatic action "Declare War Order" for heretics and heathens, giving all LiYue-JiaoHua countries a CB on the target for 10 years."
 zho_4_tianwangzhixue_tt:0 "Holding a Grand Assembly will give triple mana rewards. Additionally, you are no longer required to be the Qingshi to call for one."
 zhou_interstate_learning_tt_one:0 "Every LiYue-JiaoHua country will gain 30 of each mana."
 zhou_interstate_learning_tt_two:0 "Every LiYue-JiaoHua country will gain 10 of each mana."
 china_papacy_enchong_title:0 "Tianwang's Favor"
 china_papacy_enchong_alert_tooltip.1:0 "We will grant favors to improve relations"
 china_papacy_enchong_desc:0 "Grant favor to improve relations"
 china_papacy_enchong_tooltip:0 "Grant favor to improve relations"
 china_papacy_enchong:0 "Tianwang's Favor"
 china_papacy_zhanling_title:0 "Declare War Order"
 zhou_lesser_crusade_target:0 "Target of the Tianzi's War Order"
 china_papacy_zhanling_alert_tooltip.1:0 "We will declare this state disobedient, giving all LiYue-JiaoHua countries a CB on them and -40 opinion for 10 years. This will cost §Y500 ducats§! from the Tianwang Treasury."
 china_papacy_zhanling_desc:0 "We will declare this state disobedient, giving all LiYue-JiaoHua countries a CB on them and -40 opinion for 10 years. This will cost §Y500 ducats§! from the Tianwang Treasury."
 china_papacy_zhanling_tooltip:0 "This state does not follow the proper rites and is disregarding our supremacy, all loyal vassals should attack them!"
 zho_4_tianwangzhanling_taofa:0 "Declared Disobedient by Zhou"
 desc_zho_4_tianwangzhanling_taofa:0 "We were declared to be disobedient by the Zhou Son of Heaven, causing our relations to worsen with JiaoHua countries."
 cb_crusade_new:0 "Disobedient State"
 cb_crusade_new_desc:0 "The state has been declared disobedient by the Son of Heaven, and all LiYue-JiaoHua countries can attack it until it is destroyed or the decree expires."
 hangou_gp:0 "Hangou"
 hangou_gp_desc:0 "Hangou is a canal connecting the Yangtze River and the Huai River, allowing southern armies to quickly move north and compete with northern vassals."
 zhou_advisor_needed_tooltip:0 "Have each type of advisor employed with a level of at least 2."
