 wuu_ruqinyueguo_tier_tt1:0 "§YIf Yue is your vassal with less then 50% liberty desire, Wu inherits Yue directly and gains the permanent §!§G“Wu and Yue as One”§!§Y  modifier§!, giving reduced advisor cost and greater heir legitimacy."
