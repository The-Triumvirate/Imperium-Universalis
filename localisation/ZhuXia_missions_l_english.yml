 zho_3_chongciqilv_modifier:0 "Restore Dongyuan"
 desc_zho_3_chongciqilv_modifier:0 "The king summoned the vassals from east of the mountains and commanded: 'East to the sea, west to the river, south to Muling, north to Yan Mountain; the nine Man and eight Yi tribes, follow me in the expedition.'"
 zho_3_sushengongjian_title:0 "Sushen Tribute Arrows"
 zho_3_sushengongjian_desc:0 ""
 zho_3_sushengongjian.tt:0 "All non-vassal states in the Korea, Buyeo, and Sushen regions will become vassals of Zhou!"
 zho_3_shimaiqibang_title:0 "The Times March on Their States, Heaven Regards Them as Its Sons"
 zho_3_shimaiqibang_desc:0 "A progress through the State is done.\nO Heaven, bless your son!\nO bless the Zhou House up and down!\nOur victory is so great\nThat it shakes State on State.\nWe revere gods for ever\nOf mountain and of river.\nOur king is worthy of the crown.\nZhou's House is bright and full of grace:\nEach lord is in his proper place,\nWith spears and shields storedup in rows,\nAnd in their cases arrows and bows\nThe king will do his best\nTo rule the kingdom east and west.\nO may our king be blessed!"
