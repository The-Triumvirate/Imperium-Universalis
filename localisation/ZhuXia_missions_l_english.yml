 sunzibingfa:0 "Sun Tzu (Art of War)"
 sunzibingfa_event_1_title:0 "Sun Tzu (Art of War)"
 sunzibingfa_event_1_desc:0 "Sun Tzu may have been a Chinese military general, strategist, philosopher, and writer who lived during the Eastern Zhou period (771–256 BC). Sun Tzu is traditionally credited as the author of The Art of War, a Classical Chinese text on military strategy from the Warring States period, though the earliest parts of the work probably date to at least a century after his purported death."
 sunzibingfa_event.1.a:0 "Bring it back to the capital."
 sunzibingfa_event.1.b:0 "Burn it!"
 sunzibingfa_event.1.c:0 "Leave it aside."
