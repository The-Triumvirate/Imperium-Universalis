 wuu_zhanxianshili_title:0 "Victory at Boju"
 wuu_zhanxianshili_desc:0 "King Helü of Wu, together with Sun Wu and Wu Zixu, led an elite force of 30,000 Wu troops against Chu. At the Battle of Boju, they utterly destroyed Chu’s 200,000-strong army in one decisive blow - a classic case in Chinese military history of the few defeating the many and securing a swift victory. In the Wu–Chu War, Wu won all five engagements, broke into the capital Ying, and struck fear into the heart of all China!"
 wuu_fengzhouzhi_title:0 "Reaffirm Zhou Ancestry"
 wuu_fengzhouzhi_desc:0 "Our founder Wu Taibo and the Zhou Son of Heaven were originally from the same family, both bearing the Ji surname. It is now time to recognize our shared ancestry and return to our roots."
 wuu_gongguzhengti_title:0 "Consolidate the Regime"
 wuu_gongguzhengti_desc:0 " "
 wuu_jingbingzhidao_title:0 "The Way of Elite Troops"
 wuu_jingbingzhidao_desc:0 " "
 wuu_tuozhanjiangnandi_title:0 "Expand into Jiangnan"
 wuu_tuozhanjiangnandi_desc:0 " "
 wuu_sunzibingfa_title:0 "Compile The Art of War"
 wuu_sunzibingfa_desc:0 "Sun Wu was one of the most renowned strategists of Spring and Autumn China—revered as the Sage of War and teacher of generations, the forefather of Eastern military thought. His thirteen chapters of military theory remain known as The Art of War."
 wuu_zhuxiazhiguo_title:0 "Realm of All Xia"
 wuu_zhuxiazhiguo_desc:0 " "
 wuu_rangyi_title:0 "Expel the Barbarians"
 wuu_rangyi_desc:0 " "
 wuu_tonghejiangnan_title:0 "Unify Jiangdong"
 wuu_tonghejiangnan_desc:0 "We have brought Wu and Yue into a single state! From this day forth, integrate Wu and Yue cultures into a unified Jiangnan culture, and fold it into the broader Chinese cultural sphere."
 wuu_daxingtumu_title:0 "Great Construction"
 wuu_daxingtumu_desc:0 " "
 wuu_xiuyangshengxi_title:0 "Rest and Recuperate"
 wuu_xiuyangshengxi_desc:0 " "
 wuu_kaifajuquze_title:0 "Develop the Marshlands"
 wuu_kaifajuquze_desc:0 "The fertile banks of Gequze nourish the people of Wu."
 wuu_kaifazhejiang_title:0 "Develop the Zhe River"
 wuu_kaifazhejiang_desc:0 "Zhejiang is a land of fish and rice, rich and fertile; we should encourage settlers to cultivate it!"
 wuu_jibaiyueguo_title:0 "Defeat Yue"
 wuu_jibaiyueguo_desc:0 " "
 wuu_yuemajiangbei_title:0 "Across the Yangtze"
 wuu_yuemajiangbei_desc:0 " "
