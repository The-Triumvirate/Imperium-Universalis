 flavor_baiyue.0101.t:0 "Unfamiliar with Lingnan"
 flavor_baiyue.0101.d:0 "In the Spring and Autumn era, the Hundred Yue region of Lingnan was dense forest, sparsely populated, rife with miasma and swamps, scorched by heat, and howled by wilderness—truly unconquerable."
 flavor_baiyue.0102.t:0 "Lingnan Hardship Ends"
 flavor_baiyue.0102.d:0 "At last, the conflict with the Hundred Yue has ended. Soldiers return home, escaped from that hellish battlefield and no longer endure its torments!"
 flavor_baiyue.0103.t:0 "Familiar with Lingnan"
 flavor_baiyue.0103.d:0 "After prolonged contact with the Hundred Yue and Lingnan peoples, we know the land and have adapted to its climate and terrain."
 flavor_baiyue.0103.a:0 "Excellent!"
 flavor_baiyue.0103.tt:0 "Immune to Lingnan terrain debuffs"
 flavor_baiyue.0101.a:0 "How dreadful!"
 flavor_baiyue.0102.a:0 "Thank the heavens!"
