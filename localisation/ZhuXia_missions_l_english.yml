 wuu_jiangdongzhihu_desc:0 ""
 wuu_fazhanmaoyi_title:0 "Develop Trade"
 wuu_fazhanmaoyi_desc:0 " "
 wuu_hangou_title:0 "Dig the Han Canal"
 wuu_hangou_desc:0 "King Fuchai of Wu, preparing to contest Qi and Jin in the north, excavated the Han Canal along the Huai-Si rivers, enabling the Wu navy to sail from Gusu north through the Gequze to reach the Huai and penetrate the Central Plain. This was a marvel of the Spring and Autumn era! Later, Emperor Yang of Sui linked it into the Grand Canal."
 hangou_desc:0 "Upon completion, Wu gains the following effects on the Han Canal: +5% global trade efficiency and +15% embargo efficiency at tier 1; +10% and +30% at tier 2; +15% and +50% at tier 3."
 wuu_hangou_tier_tt:0 "Can construct the great project §OHan Canal§!, upon completion Wu gains the following effects on the canal:"
 wuu_hangou_tier_tt1:0 "§G+5% Global Trade Efficiency, +15% Embargo Efficiency at tier 1§!"
 wuu_hangou_tier_tt2:0 "§G+10% Global Trade Efficiency, +30% Embargo Efficiency at tier 2§!"
 wuu_hangou_tier_tt3:0 "§G+15% Global Trade Efficiency, +50% Embargo Efficiency at tier 3§!"
 wuu_xiquchaoshu_title:0 "Chaohu and Shuchu"
 wuu_xiquchaoshu_desc:0 "The Chaohu-Shuchu region is the strategic gateway from Wu to Chu."
 wuu_baichuruying_title:0 "Defeat Chu, Enter Ying"
 wuu_baichuruying_desc:0 " "
