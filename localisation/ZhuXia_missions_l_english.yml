 wuu_jizharangguo_title:0 "Kong Zha Yields the Throne"
 wuu_jizharangguo_desc:0 "King Shoumeng of Wu had four sons: Zhu Fan, Yu Ji, Yu Mo, and Ji Zha. Ji Zha was virtuous, and Shoumeng wished to make him heir, but Ji Zha humbly declined. Thus the eldest, Zhu Fan, was made heir and acted as regent. After funeral rites, Zhu Fan ceded the throne to Ji Zha. Ji Zha replied, “It is righteous for a ruler to have an heir; who dares to obstruct him? A state is not maintained by my restraint alone. Though I lack talent...”"
 wuu_jizhaguanyue_title:0 "Ji Zha Observes Music"
 wuu_jizhaguanyue_desc:0 "In Lu, Ji Zha admired Zhou ritual music, poetry, and dance, advocating the “beauty of balance,” as in “sorrow without despair,” “joy without excess.” His gentlemanly conduct provided a human embodiment of Confucian ritual and music ideals, later praised by successors. As recorded in the Strategies of the Warring States: “In olden times, Taibo of Zhou yielded the realm three times, and Ji Zha of Yan refused a state and did not reside there, thus civilizing the Jing barbarians...”"
 wuu_lianjinkangchu_title:0 "Alliance with Jin against Chu"
 wuu_lianjinkangchu_desc:0 "Jin and Chu vied for supremacy for over a century with no decisive outcome. After their peace at Mabei, both became cautious in their struggle over the Central Plain. Meanwhile, the Wu-Yue-Jianghuai region emerged as a new geopolitical arena. Jin sought to support Wu against Chu’s advances, and Wu, pressured by Chu, also needed a Central Plain ally!"
 wuu_nanzhengbaiyue_tier_tt:0 "§O Gain the casus belli “Expel the Barbarians” against all tribal states with capitals at Yangzhou, Jingzhou, and Jiaozhou§!"
 wuu_ruqinyueguo_title:0 "The Fate of Yue"
 wuu_ruqinyueguo_desc:0 "Although Yue formally submitted, it secretly nursed resentment and plotted Wu’s downfall. Wu Zixu had warned that ‘Qi and Chu are but superficial ailments of Wu, but Yue is a deep-seated threat.’ Now is the time to eliminate Yue!"
 wuu_wugexijia_title:0 "Wu Spear and Rhinoceros Hide Armor"
 wuu_wugexijia_desc:0 "Learn rhinoceros-hide armor crafting from our Central Plain allies and pair it with our native Wu halberds to equip our powerful army!"
 wuu_jijiangqiguo_title:0 "Provoke the State of Qi"
 wuu_jijiangqiguo_desc:0 "Now that we hold both sides of the Yangtze, Qi north of Xuzhou stands in our way. To advance into the Central Plain, we must eliminate the threat of Qi!"
 wuu_zhanshengqiguo_title:0 "Defeat Qi"
 wuu_zhanshengqiguo_desc:0 " "
 wuu_yaowangzhongyuan_title:0 "Set Sights on the Central Plain"
 wuu_yaowangzhongyuan_desc:0 "We have vanquished Chu and Qi, two of the strongest states. Now none can threaten us; Jiangdong’s sons march into the Central Plain!"
 wuu_xuexizhongyuanlizhi_title:0 "Adopt Central Plain Rituals"
 wuu_xuexizhongyuanlizhi_desc:0 "Learn advanced ceremonial institutions from the Central Plain states."
