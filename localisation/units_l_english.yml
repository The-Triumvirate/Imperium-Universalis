  egypt_uniq_art_14DESCR:0 "Soldiers from machimoi - special military caste."
  egypt_uniq_art_15:0 "§YAdvanced Thureophoroi Machimoi§!"
  egypt_uniq_art_15DESCR:0 "Native egyptians copying latest greco-roman skirmisher formations."

