  egypt_uniq_art_9DESCR:0 "Bow was one of most important weapons of egyptian army."
  egypt_uniq_art_10:0 "§YArmored Egyptian Machimoi Archers§!"
  egypt_uniq_art_10DESCR:0 "Bow was one of most important weapons of egyptian army. And having basic armor helps to survive the enemy's one."
  egypt_uniq_art_11:0 "§YArabic Skirmishers§!"
  egypt_uniq_art_11DESCR:0 "Expanding recruitment to arabic tribes of south east will help to fill the army with light troops."
