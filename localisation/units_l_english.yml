  egypt_uniq_art_12DESCR:0 "Bow was one of most important weapons of egyptian army. And having basic armor helps to survive the enemy's one."
  egypt_uniq_art_13:0 "§YThureophoroi Peltastai§!"
  egypt_uniq_art_13DESCR:0 "Greek-like heavy skirmishers with Thureos celtic shield."
