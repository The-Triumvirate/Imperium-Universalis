  egypt_uniq_inf_0:0 "§YEarly Lybo-Egyptian Soldiers§!"
  egypt_uniq_inf_0DESCR:0 "Lybians and egyptians alike fight for their pharaoh who gives them land plots."
  egypt_uniq_inf_1:0 "§YEgyptian Axemen§!"
  egypt_uniq_inf_1DESCR:0 "Spear and sword is a good choice, but sometimes you just need to say 'its axe time!' and charge to break the enemy lines and armor."
  egypt_uniq_inf_2:0 "§YEgyptian Kalasyri Spearmen§!"
  egypt_uniq_inf_2DESCR:0 "Military division of egyptian infantry on a few regional wings, or probably even castes, Kalasyri and Hermobitii, described by Herodotus."
  egypt_uniq_inf_3:0 "§YEgyptian Hermobytii Swordsmen§!"
  egypt_uniq_inf_3DESCR:0 "Military division of egyptian infantry on a few regional wings, or probably even castes, Kalasyri and Hermobitii, described by Herodotus."
  egypt_uniq_inf_4:0 "§YEgyptian Spearmen§!"
  egypt_uniq_inf_4DESCR:0 "Egyptian soldiers forming tight formations, inspired by greek or carian mercenaries."
  egypt_uniq_inf_5:0 "§YEgyptian Marines§!"
  egypt_uniq_inf_5DESCR:0 "Egyptian or foreign sailors, supporting the fleet, sometimes not only in sea."
  egypt_uniq_inf_6:0 "§YEgyptian Armored Spearmen§!"
  egypt_uniq_inf_6DESCR:0 "Egyptian soldiers using greek arms."
  egypt_uniq_inf_7:0 "§YEgyptian Armored Swordsmen§!"
  egypt_uniq_inf_7DESCR:0 "Egyptian soldiers using greek arms."
  egypt_uniq_inf_8:0 "§YEgyptian Levy Phalanx§!"
  egypt_uniq_inf_8DESCR:0 "Who said we cannot just copy those ionians formations?"
  egypt_uniq_inf_9:0 "§YEarly Machimoi Phalanx§!"
  egypt_uniq_inf_9DESCR:0 "Soldiers from machimoi - special military caste."
  egypt_uniq_inf_10:0 "§YMachimoi Phalanx§!"
  egypt_uniq_inf_10DESCR:0 "Soldiers from machimoi - special military caste."
  egypt_uniq_inf_11:0 "§YMachimoi Swordsmen§!"
  egypt_uniq_inf_11DESCR:0 "Soldiers from machimoi - special military caste."
  egypt_uniq_inf_12:0 "§YLate Machimoi Phalanx§!"
  egypt_uniq_inf_12DESCR:0 "Soldiers from machimoi - special military caste."
  egypt_uniq_inf_13:0 "§YMachimoi Thureophoroi§!"
  egypt_uniq_inf_13DESCR:0 "Soldiers from machimoi - special military caste."
  egypt_uniq_inf_14:0 "§YMachimoi Machairophoroi§!"
  egypt_uniq_inf_14DESCR:0 "Native egyptians copying roman formations."
  egypt_uniq_inf_15:0 "§YMachimoi Thorakitai Machairophoroi§!"
  egypt_uniq_inf_15DESCR:0 "Native egyptians copying roman formations. Now with proper armor."

  egypt_uniq_cav_0:0 "§YEgyptian Light Chariots§!"
  egypt_uniq_cav_0DESCR:0 "Last chariots in use on battlefields of antiquity, remnants of fading era. Lighter egyptian chariots were primarily used as a platform for archers or to carry certain numbers of infantry on the field fast, but were not advised to charge lines of enemy light troops, as that may end with chariot destruction and horses death."
  egypt_uniq_cav_1:0 "§YEarly Lybo-Egyptian Cavalry§!"
  egypt_uniq_cav_1DESCR:0 "Mounted lybians and egyptians alike fight for their pharaoh who gives them land plots."
  egypt_uniq_cav_2:0 "§YBorder Guards Cavalry§!"
  egypt_uniq_cav_2DESCR:0 "Border guards of lybian or other foreign origin."
  egypt_uniq_cav_3:0 "§YLybo-Egyptian Cavalry§!"
  egypt_uniq_cav_3DESCR:0 "Mounted lybians and egyptians alike fight for their pharaoh who gives them land plots."
  egypt_uniq_cav_4:0 "§YLybian Mounted Skirishers§!"
  egypt_uniq_cav_4DESCR:0 "Mounted lybian allies providing good light cavalry."
  egypt_uniq_cav_5:0 "§YEgyptian Horsemen§!"
  egypt_uniq_cav_5DESCR:0 "Native egyptians can be a cavalry, if it is needed, though usually they are not numerous."
  egypt_uniq_cav_6:0 "§YEgyptian Noble Cavalry§!"
  egypt_uniq_cav_6DESCR:0 "Native egyptians can be a cavalry, if it is needed, though usually they are not numerous."
  egypt_uniq_cav_7:0 "§YEgyptian Machimoi Cavalry§!"
  egypt_uniq_cav_7DESCR:0 "Soldiers from machimoi - special military caste."
  egypt_uniq_cav_8:0 "§YMachimoi Linokataphraktoi§!"
  egypt_uniq_cav_8DESCR:0 "Cavalry with men and horses covered not in heavy iron armors, but linen armor, suitable for heat and desert warfare."
  egypt_uniq_cav_9:0 "§YLate Egyptian Linokataphraktoi§!"
  egypt_uniq_cav_9DESCR:0 "Cavalry with men and horses covered not in heavy iron armors, but linen armor, suitable for heat and desert warfare."
  egypt_uniq_cav_10:0 "§YLate Egyptian Cavalry§!"
  egypt_uniq_cav_10DESCR:0 "Late Egyptian cavalry, average in everything, but we have what we have."

  egypt_uniq_art_0:0 "§YLevy and Ta Seti Archers§!"
  egypt_uniq_art_0DESCR:0 "Rising stars of 26th dynasty, mix of nubian superior Ta Seti snipers and local archers."
  egypt_uniq_art_1:0 "§YEarly Lybo-Egyptian Skirmishers§!"
  egypt_uniq_art_1DESCR:0 "Lybians and egyptians alike fight for their pharaoh who gives them land plots."
  egypt_uniq_art_2:0 "§YEarly Egyptian Levy Archers§!"
  egypt_uniq_art_2DESCR:0 "Bow was one of most important weapons of egyptian army."
  egypt_uniq_art_3:0 "§YTa Seti Archers§!"
  egypt_uniq_art_3DESCR:0 "By inviting nubian archers with promises of glory, gold, and land plots, we can be sure we have best sharpshooters of Africa."
  egypt_uniq_art_4:0 "§YLybo-Egyptian Skirmishers§!"
  egypt_uniq_art_4DESCR:0 "Lybians and egyptians alike fight for their pharaoh who gives them land plots."
  egypt_uniq_art_5:0 "§YEgyptian Levy Archers§!"
  egypt_uniq_art_5DESCR:0 "Bow was one of most important weapons of egyptian army."
  egypt_uniq_art_6:0 "§YForeign Slingers§!"
  egypt_uniq_art_6DESCR:0 "Greek slaves, judean mercenaries or saracenian shepherds, all they can be used to harrass the enemy with cheap ammunition."
  egypt_uniq_art_7:0 "§YLate Egyptian Levy Archers§!"
  egypt_uniq_art_7DESCR:0 "Bow was one of most important weapons of egyptian army."
  egypt_uniq_art_8:0 "§YMachimoi Shielded Skirmishers§!"
  egypt_uniq_art_8DESCR:0 "Soldiers from machimoi - special military caste, fighting in greek peltastes style."
