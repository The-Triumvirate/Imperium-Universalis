  rome_base_inf_0:0 "§RAncient Roman Phalanx§!"
  rome_base_inf_0DESCR:0 "Armed as they can afford, semi-tribal citizens of Rome form a line, that fight like greek or etrurian phalanx."
  rome_base_inf_1:0 "§RServian Roman Phalanx§!"
  rome_base_inf_1DESCR:0 "Under Servius romans were separated via their wealth into different classes and regiments but still operated as parts of one phalanx."
  rome_base_inf_2:0 "§RLate Roman Phalanx§!"
  rome_base_inf_2DESCR:0 "After Servius Romans still fought as phalanx, but started to use more socii forces on flanks, and set triarii back."
  rome_base_inf_3:0 "§RCamillan Triplex Acies Maniples§!"
  rome_base_inf_3DESCR:0 "At Furius Camillus times, Rome abandoned old phalanx style, that was not fitting to deal with samnites in their mountains, and adopted their more flexible military organisation via small groups of same wealth and equipment - maniples."
  rome_base_inf_4:0 "§RTriplex Acies Cohorts§!"
  rome_base_inf_4DESCR:0 "First Punic War and many losses in wars showed importance of quick education of soldiers, and by mixing young hastati and more experienced principes into one unit, romans managed to get their troops to fight more effectively in bigger new regiments - cohorts."
  rome_base_inf_5:0 "§RPolybian Roman cohorts§!"
  rome_base_inf_5DESCR:0 "Classic mail-clad unit of heavy roman infantry with gladius and scutum, armed with 2 pilas. Reformed in Second Punic War times to match some heavier Hannibal infantry troops, and afterwards responsible for Rome's rapid expansion in all directions."
  rome_base_inf_6:0 "§YCohors Legionaria§!"
  rome_base_inf_6DESCR:0 "Roman Cohort after Marian reforms, even more trained and professional, and now attracts huge amount of poor italics."
  rome_base_inf_7:0 "§YCohors Evocati§!"
  rome_base_inf_7DESCR:0 "Veteran legionaries, that served 25+ years, and then returned to service after retirement for bigger pay. Evocati were often called into army by Caesar, Marcus Antonius, Octavian and other notable generals of Roman Civil Wars time, and were rarely seen on battlefields after that period."
  rome_base_inf_8:0 "§YCohors Auxilia§!"
  rome_base_inf_8DESCR:0 "Additional Cohorts, raised from local inhabitants of Late Roman Republic or Empire, to serve as support for named legions or for garrison duties."
  rome_base_inf_9:0 "§YLate Cohors Auxilia§!"
  rome_base_inf_9DESCR:0 "In the mid to late 3rd century, the army was afflicted by a combination of military disasters and of pestilence, the so-called Crisis of the Third Century. This led to a steep decline in military numbers. The recruitment shortfall caused by the crisis seems to have led to recruitment of barbarians to the auxilia on a much greater scale than previously. By the 4th century, it has been estimated that some 25% of regular army recruits were barbarian-born."
  rome_base_inf_10:0 "§YCohors Limitanenses§!"
  rome_base_inf_10DESCR:0 "Lower-paid, border troops of Late Roman Empire, served as first line of defence, in garrisons across the limes. After 5th century they become part-time soldiers, and lost professional status."
  rome_base_inf_11:0 "§YCohors Comitanenses§!"
  rome_base_inf_11DESCR:0 "The comitatenses and later the palatini were the units of the field armies of the late Roman Empire. They were the soldiers that replaced the legionaries, who had formed the backbone of the Roman military since the Marian reforms."
  rome_legio_inf_default:0 "§YLegio Cohort§!"
  rome_base_inf_11DESCR:0 "Classic most iconic roman legionaries of the Early Empire times."
  rome_base_art_0:0 "§RAccensii§!"
  rome_base_art_0DESCR:0 "Poorest lass of romans, who can not afford any weapon, and just throw something on enemies behind phalanx ranks"
  rome_base_art_1:0 "§REarly Leves§!"
  rome_base_art_1DESCR:0 "Same Accensii, now armed with javelins, picked from battle sites or provided from state or richer patrons."
  rome_base_art_2:0 "§REarly Socii Velites§!"
  rome_base_art_2DESCR:0 "More experienced allied askirmishers."
  rome_base_art_3:0 "§RLeves"
  rome_base_art_3DESCR:0 "Later Leves were organized to support first lines of hastati, and initiate a battle, sometimes forming skirmisher line with javelins before roman positions."
  rome_base_art_4:0 "§RFunditores Socii§!"
  rome_base_art_4DESCR:0 "Skilled slingers from mountanous allied tribes and towns."
  rome_base_art_5:0 "§RSocii Velites§!"
  rome_base_art_5DESCR:0 "Skilled skirmishers from mountanous allied tribes and towns"
  rome_base_art_6:0 "§RPolybian Roman Velites§!"
  rome_base_art_6DESCR:0 "At times of Punic Wars former leves were reformed and integrated into new skirmisher unit - velites, youngest of warriors, who initiated batte, peppering enemy with pilums or lighter javelins."
  rome_base_art_7:0 "§RFunditores Baleares§!"
  rome_base_art_7DESCR:0 "Most skilled slingers of Mediterranean, rival only to Rhodian ones, Balearic mercenaries often took payment in wine and women, rather then gold they could not spend in their poor island homeland."
  rome_base_art_8:0 "§RCretan Archers§!"
  rome_base_art_8DESCR:0 "After meeting cretan archers in battle in Greece, romans often hired them to accompany legions in battle, and valued their skills."
  rome_base_art_9:0 "§RAllied Archers§!"
  rome_base_art_9DESCR:0 "Archers from different allied lands, from Gaul to Syria, provided support to Late Republic legions."
  rome_base_art_10:0 "§RAntesignani§!"
  rome_base_art_10DESCR:0 "Chosen people from allied regiments or legion members after Marian reforms, they were either fighting in first ranks "before" the legion sign, skirmishing before legio, or were used in special operations and flanking assaults."
  rome_base_art_11:0 "§RArcher Auxiliae§!"
  rome_base_art_11DESCR:0 "Romans formed Auxilia Cohorts of archers from Syria, Crete, Thrace or other regions, and sent them to accompany legions in most unusual places."
  rome_base_art_12:0 "§RSkirmisher Auxiliae§!"
  rome_base_art_12DESCR:0 "Skirmisher cohorts from Iberia, Aquitania, Anatolia or Thracia were often sent to accompany legions in most unusual places."
  rome_base_art_13:0 "§RCohors Saggitariorum§!"
  rome_base_art_13DESCR:0 "Romans formed Auxilia Cohorts of archers from Syria, Crete, Thrace or other regions, and sent them to accompany legions in most unusual places."
  rome_base_art_14:0 "§RLate Saggitarii§!"
  rome_base_art_14DESCR:0 "Romans formed Auxilia Cohorts of archers from Syria, Crete, Thrace or other regions, and sent them to accompany legions in most unusual places."
  rome_base_art_15:0 "§RFoederati Skirmishers§!"
  rome_base_art_15DESCR:0 "In the mid to late 3rd century, the army was afflicted by a combination of military disasters and of pestilence, the so-called Crisis of the Third Century. This led to a steep decline in military numbers. The recruitment shortfall caused by the crisis seems to have led to recruitment of barbarians to the auxilia on a much greater scale than previously. By the 4th century, it has been estimated that some 25% of regular army recruits were barbarian-born"
  rome_base_art_16:0 "§RFoederati Archers§!"
  rome_base_art_16DESCR:0 "In the mid to late 3rd century, the army was afflicted by a combination of military disasters and of pestilence, the so-called Crisis of the Third Century. This led to a steep decline in military numbers. The recruitment shortfall caused by the crisis seems to have led to recruitment of barbarians to the auxilia on a much greater scale than previously. By the 4th century, it has been estimated that some 25% of regular army recruits were barbarian-born"
  rome_base_art_17:0 "§RPsiloi Limitanenses§!"
  rome_base_art_17DESCR:0 ""
  rome_base_art_18:0 "§RPsiloi Comitanenses§!"
  rome_base_art_18DESCR:0 ""
  rome_base_art_19:0 "§RFunditores Accensii§!"
  rome_base_art_19DESCR:0 "Poorest people from former 5th class citizens, armed only with slings"

  rome_base_cav_0:0 "§RCeleres§!"
  rome_base_cav_0DESCR:0 "The celeres were the bodyguard of the Kings of Rome. Traditionally established by Romulus, the legendary founder and first King of Rome, the celeres comprised three hundred men, ten chosen by each of the curiae."
  rome_base_cav_1:0 "§REarly Roman Equites§!"
  rome_base_cav_1DESCR:0 "King Servius Tullius established a 12 centuriae of equites, first class plebeians, that gained more rights due to their wealth, and enforsed them to bring a warhorse, further tripling the cavalry of Rome."
  rome_base_cav_2:0 "§RRoman Equites§!"
  rome_base_cav_2DESCR:0 "The 12 additional centuriae ascribed by Livy to Servius Tullius were, in reality, probably formed around 400 BC. In 403 BC, according to Livy, in a crisis during the siege of Veii, the army urgently needed to deploy more cavalry, and "those who possessed equestrian rating but had not yet been assigned public horses" volunteered to pay for their horses out of their own pockets. By way of compensation, pay was introduced for cavalry service, as it had already been for the infantry."
  rome_base_cav_3:0 "§RLatin Socii Cavalry§!"
  rome_base_cav_3DESCR:0 "From the period of Samnie Wars, every Roman army that took the field was regularly accompanied by at least as same number of troops supplied by the socii. Each legion would be matched by a confederate ala (literally "wing"), a formation that contained roughly the same number of infantry as a legion, but three times the number of horses (900), and was fighting in their native style."
  rome_base_cav_4:0 "§RCamillan Roman Equites§!"
  rome_base_cav_4DESCR:0 "Under Camillus romans enlarged their cavalry, and armed it more heavily, as socii filled the ranks of light cavalry support."
  rome_base_cav_5:0 "§RSocii Equites Campanii§!"
  rome_base_cav_5DESCR:0 "Control of Campania in the aftermatch of Samnite wars throught socii, led to their mounted regiments joining roman ranks, providing best middle cavalry in region for their new overlords."
  rome_base_cav_6:0 "§RPolybian Equites Consulares§!"
  rome_base_cav_6DESCR:0 "Legionary cavalry also probably underwent a transformation during Punic Wars period, from the light, unarmoured horsemen of the early period to the Greek-style armoured cuirassiers in mail armor, described by Polybius. Roman cavalry in the field thus increased to approximately 1,200 horses per consular legio."
  rome_base_cav_7:0 "§RSocii Equites Estraordinarii§!"
  rome_base_cav_7DESCR:0 "Heavier armed socii, picked from the best, were called Equites Extraordinarii, and were used to counter enemy cavalry in most brutal ways. They included campanian, lucanian, tarentine, iberian or celtic cavalry."
  rome_base_cav_8:0 "§RAllied Cavalry§!"
  rome_base_cav_8DESCR:0 "After Punic War and expansion of republic, Rome gained access to th different cavalry of conquered or allied people, from numidians and equestrian iberias or gauls, to cavalry of the East or famous thracian riders. By the end of the 1st Century BC citizen cavalry disappeared completely from the Roman army. The citizen cavalry was replaced by foreign auxiliaries, and equites themselves were already serving only as officers."
  rome_base_cav_9:0 "§RCohors Alaria§!"
  rome_base_cav_9DESCR:0 "By the time of Gaius Julius Caesar's Gallic War (58-51 BC), it appears that legionary cavalry may have disappeared altogether, and that Caesar was entirely dependent on allied Gallic contingents for his cavalry operations. The main reason is probably the limited pool of available equites and First Class members. The equites had long since become exclusively an officer class (a role they retained throughout the Principate), as the empire had become simply too large and complex for aristocrats to serve as ordinary troopers. At the same time, many of the First Class of commoners had developed major business interests and had little time for military service."
  rome_base_cav_10:0 "§RAlae Auxiliae§!"
  rome_base_cav_10DESCR:0 "When the Republic transitioned into the Empire, Augustus made a regular Auxilia corps of non-citizen soldiers. These professional Roman soldiers, like the Legions, were subjects recruited from the non-citizens in provinces controlled by Rome that had strong native cavalry traditions."
  rome_base_cav_11:0 "§RCohors Equitata§!"
  rome_base_cav_11DESCR:0 "Cohort of legionaries with attached auxiliary cavalry. These men, unlike the Allied Foederetii cavalry, were a regular part of the Roman army and were paid and trained by the Roman State. Arrian describes them as well-equipped and performing well-executed maneuvers. A typical cavalrymen of the Cavalry Ala would be paid 20 percent more than a typical citizen legionary."
  rome_base_cav_12:0 "§REarly Ala Cataphractorum§!"
  rome_base_cav_12DESCR:0 "Although Augustus created regular Auxiliaries, irregular allied forces were still used. For example, Marcus Aurelius recruited Sarmatian allied cavalry to be stationed in Britain. Sarmatian Cataphract Alas were hired due to their insane charge on the battlefield, that could make a final point to any battle if used wisely."
  rome_base_cav_13:0 "§RLate Ala Auxiliae§!"
  rome_base_cav_13DESCR:0 "In 212, the constitution Antoniniana of emperor Caracalla granted Roman citizenship to all the free inhabitants of the Empire – the peregrini – thus abolishing their second-class status. Auxiliary units were now recruited mainly from Roman citizens."
  rome_base_cav_14:0 "§RAla Dromedariae§!"
  rome_base_cav_14DESCR:0 "Auxiliaries from souther and easter edges of empire, or arab mercenaries, that used camels to scare enemy cavalry."
  rome_base_cav_15:0 "§RAla Cataphractorum§!"
  rome_base_cav_15DESCR:0 "By the time of the 3rd century, the Constitution Antoniniana granted all peoples citizenship rights, and citizen cavalry was in use technically. Gallienus in 260 created a mobile reserve cavalry corps to respond to the empire's threats. Responding to Persian cavalry known as grivpanvar, large numbers of heavily armored cavalry units such as cataphractarii, clibinarii, started to appear by the 4th century. These units were armed with a large spear, a sword and a bow."
  rome_base_cav_16:0 "§REarly Equites Foederati§!"
  rome_base_cav_16DESCR:0 "In the mid to late 3rd century, the army was afflicted by a combination of military disasters and of pestilence, the so-called Crisis of the Third Century. This led to a steep decline in military numbers. The recruitment shortfall caused by the crisis seems to have led to recruitment of barbarians to the auxilia on a much greater scale than previously. By the 4th century, it has been estimated that some 25% of regular army recruits were barbarian-born."
  rome_base_cav_17:0 "§REquites Foederati§!"
  rome_base_cav_17DESCR:0 "By the 4th century, Romans relied heavily on irregular allies from the migrating Germanic tribes and the Huns. Such barbaric cavalry, often even led by their native chiefs, still proved their effectiveness, and were loyal for Empire. R-right?"
