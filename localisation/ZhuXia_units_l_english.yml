 manyue_cavalry_6:0 "Early War Elephants"
 manyue_cavalry_6DESCR:0 "Elephants are abundant in our home region, and we have begun to experiment with utilizing them for war. However, they are slower than chariots and can be more unstable."
 manyue_cavalry_14:0 "Nanman War Elephants"
 manyue_cavalry_14DESCR:0 "By now we have long used elephants in our armies, which greatly terrifies northern invaders."
 manyue_cavalry_58:0 "Various Yue Cavalry"
 manyue_cavalry_58DESCR:0 "As the Zhongyuan culture moved to farther places in the south, the Baiyue tribes also began to own their own cavalry units. However, these cavalry lacked training and the horses relied heavily on trade with the north. Therefore, as a military presence, their strength was limited."
 RSO_ADJ:0 ""
 wuyue_cavalry_1:0 "Imitated Chariot"
 wuyue_cavalry_1DESCR:0 "Although we currently do not often make use of horses, we're aware of their importance in regions north of us. This allows us to imitate them for our own purposes, albeit poorly."
