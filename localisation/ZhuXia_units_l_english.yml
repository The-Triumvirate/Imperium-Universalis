 dongyi_chariot_12:0 "Bow Chariot"
 dongyi_chariot_12DESCR:0 "The main combat use of the chariot on the battlefield is to shock the enemy, but it is usually equipped with an archer who is responsible for long-range shooting. The combination of bow and arrow and chariot has been thoroughly developed among the Dongyi people."
 qiguo_chariot_54:0 "Burning Bull Array"
 qiguo_chariot_54DESCR:0 "The Burning Bull Array was successfully used by a famous tactic during the Warring States Period. The general of the Qi State, Tian Dan, used the bulls with flammable materials and ignited as a pioneer to attack the Yan Army."
 zhongyuan_chariot_1:0 "Four-Horses Chariot"
 zhongyuan_chariot_1DESCR:0 "The Four-Horses Chariot is a combat vehicle driven by four horses. After the Western Zhou Dynasty, as car warfare became the main combat method at that time, the Four-Horses Chariot appeared with better performance. Generally, there are three soldiers in each chariot: the driver who drives the chariot, the bow (crossbow) hand who fights far and the soldier who fights melee."