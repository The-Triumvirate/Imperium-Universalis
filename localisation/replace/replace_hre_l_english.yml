 HRE_REFORMS:0 "Zhuxia Reforms"
 HRE_JOIN:0 "Join Zhuxia"
 emperor_reichsreform_title:0 "Liberate Xia from Barbarians"
 emperor_reichsreform_desc:0 "As members of the Zhuxia, it is necessary for us to liberate states who have fallen to barbarians."
 emperor_reichsregiment_title:0 "Collection of Tribute"
 emperor_reichsregiment_desc:0 "The Fangbo will be given the privilege to demand tribute from their neighbouring polities, and the Bazhu will be given the right to demand tribute from all the Zhuhou."
 emperor_reichsstabilitaet_title:0 "Integrate Barbarians into the Zhuxia"
 emperor_reichsstabilitaet_desc:0 "Some barbarians are not nomadic like the Rong and Di. They are a settled people, and thus they can potentially be brought into the Zhuxia and taught Zhou customs."
 emperor_perpetual_diet_title:0 "Assembly City"
 emperor_perpetual_diet_desc:1 "The many lords often bicker and get into petty conflicts with one another. We should establish a place to hold routine meetings between the lords which will be overseen by the Bazhu."
 emperor_erbkaisertum_title:0 "Bazhu Conflict Intervention"
 emperor_erbkaisertum_desc:0 "The Bazhu will be given the right to intervene in any offensive conflict within the Zhuxia on the side of the defender."
 emperor_landfriede_title:0 "Creation of a Zhuxia Army"
 emperor_landfriede_desc:0 "In order to better defend the Zhuxia, all men should be trained in warfare in the case of an attack from the barbarians."
 emperor_landsknechtswesen_title:0 "Perpetual Hegemony"
 emperor_landsknechtswesen_desc:0 "The Hegemony should be held in perpetuity by the family who have proven themselves worthy!"
 emperor_reichstag_collegia_title:0 "Increased Shenshou"
 emperor_reichstag_collegia_desc:0 "We will allow any small state to gain the status of Shenshou if they desire."
 emperor_expand_gemeiner_pfennig_title:0 "Enforcement of Rites"
 emperor_expand_gemeiner_pfennig_desc:0 "Only when all lords of the Zhuxia adhere to the proper rites, may the realm maintain a lasting peace."
 emperor_rechenschaft_title:0 "Spread Voice and Conversion"
 emperor_rechenschaft_desc:0 "Sometimes the power of culture and etiquette is stronger than that of an army."
 emperor_geteilte_macht_title:0 "Loyal Fangbo"
 emperor_geteilte_macht_desc:0 "The Fangbo shall become stewards of the Bazhu, acting as deputy guards to the Zhou world."
 emperor_hepingzhiyue_title:0 "Great War Against All Barbarians"
 emperor_hepingzhiyue_desc:0 "Barbarians have threatened Huaxia throughout history - we will lead a great war in all four directions just as the early Zhou kings did to pacify the Rong, Di, Yi, and Man."
 emperor_reichskrieg_title:0 "Rebuild the Zhou World"
 emperor_reichskrieg_desc:0 "Duke Huan and Guan Zhong envisioned the Bazhu as the leader of the Zhou world and representative of the Tianzi. Now that we have ensured our position among the other states and fought all across the world in the name of the King, we shall restore the once great Zhou system and protect his majesty for ten thousand years!"
 emperor_reichstag_collegia_emperor_per_prince:0 "Zhuhou"
 BAZHU_FINAL_DECENTRALIZE:0 "§YAll Zhuxia states will become your Fengjian Vassal States.§!\n§YThe Zhuxia will no longer dismantle from lack of states.§!\n§YYou will gain new Bazhu diplomatic actions.§!\n§YZhou will regain control over FengHao.§!\n§YInternal Zhuxia Wars will be disabled.§!"
 emperor_gemeinerpfennig_title:0 "Regular Tribute"
 emperor_gemeinerpfennig_desc:0 "The system of tribute enjoyed by the Bazhu and Fangbo will become standardized, no longer requiring the consent of the Zhuhou."
 emperor_hofgericht_title:0 "Regular Court Visits"
 emperor_hofgericht_desc:0 "The Zhuhou should visit the capital city of the Bazhu regularly to pay their respects and to show their loyalty."
 emperor_imperial_estates_title:0 "Send Hostages"
 emperor_imperial_estates_desc:0 "All Zhuhou should send their successors to the capital city of the Bazhu as hostages, waiting for the Bazhu to confirm their right of inheritance."
 emperor_privilegia_de_non_appelando_title:0 "Army Prohibited"
 emperor_privilegia_de_non_appelando_desc:0 "The fact that the many lords are allowed to field as many armies as they wish is the root cause of the ceaseless turmoil in the world. We must severely limit the number of forces the lords are allowed to upkeep, so that they are further reliant on us for protection.\n"
 emperor_renovatio_title:0 "Conferring Titles"
 emperor_renovatio_desc:0 "We shall control the ruling houses of the Zhuhou."
 emperor_natuguiyi_title:0 "United Zhuxia"
 emperor_natuguiyi_desc:0 "The world is suffering from endless fighting because of the disunity experienced for centuries now. Only when reunification is achieved can there be peace."
