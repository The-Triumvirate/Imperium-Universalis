 EVTNAME9073:0 "Restore Order to the World"
 EVTDESC9073:0 "The Bazhu, having guarded the Zhou for generations and restored order to the whole world, ended fighting among the many lords, and ensuring prosperity, has clearly obtained Heaven's mandate. The Zhou King shall willingly step down from his position as Wang and Tianzi and allow our lord to take his place. All Zhuhou shall be ordered to pay homage and submit to us. By lord [Root.Monarch.GetName]'s grace, the most important Zhuhou may retain their capital city to continue ancestral sacrifices if they wish. All who disobey will be brought in by force!"
 EVTOPTA9073:0 "Wansui!"
 EVTNAME9074:0 "Restore Order to the World"
 EVTDESC9074:0 "The reform has been passed and we are no longer an independent nation. Our only choice is to be loyal to our hegemon or to fight him."
 EVTOPTA9074:0 "Pledge allegiance to the Bazhu"
 EVTOPTB9074:0 "He may be able to kill us, but he can't take away our freedom."
 EVTNAME900:0 "New Bazhu Chosen!"
 EVTDESC900:0 "Long live the Bazhu! Hegemony of China remains in hands of $COUNTRY$."
 EVTDESC900_01:0 "After the death of the previous Bazhu, The Fangbo made a covenant in $COUNTRY$, and agreed that we should continue the hegemony our predecessor had; thus, the Zhou Tianzi officially bestowed the title of "Ba" upon our lord [Root.Monarch.GetName]. So long as we maintain good relations with the Fangbo, and have sufficient military power, our heir will likely become hegemon as well."
 EVTOPTA900:0 "Excellent!"
 EVTNAME901:0 "Zhuhou Restored"
 EVTDESC901:0 "$FROMCOUNTRY$ has been restored, and sacrifices to their ancestral house may now continue."
 EVTOPTA901:0 "Great!"
 EVTNAME902:0 "Heretical Monarch"
 EVTDESC902:0 "$FROMCOUNTRY$, a lord of Zhuxia has ceased to pay respects to the Zhou Tianzi."
 EVTOPTA902:0 "Do they intend to be like Chu?"
 EVTNAME903:0 "JiaoHua Reestablished"
 EVTDESC903:0 "$FROMCOUNTRY$, a lord of the Zhuxia who had previously defied the Tianzi is now respecting the Son of Heaven once more."
 EVTOPTA903:0 "Great!"
 EVTNAME904:0 "Glory of Zhuxia!"
 EVTDESC904:0 "The Zhuhou of the Zhuxia have defeated the evil barbarians of $FROMCOUNTRY$!"
 EVTOPTA904:0 "They really were no match."
 EVTNAME905:0 "Zhuhou Overrun!"
 EVTDESC905:0 "$FROMCOUNTRY$, one of the lords of the Zhuxia has been overrun by barbarians! Their state has been completely destroyed!"
 EVTOPTA905:0 "Horrible!"
 EVTNAME907:0 "A Zhuhou is restored"
 EVTDESC907:0 "$FROMCOUNTRY$ a member state of Zhuxia has been freed from barbarian!"
 EVTOPTA907:0 "Great!"
 EVTNAME908:0 "Defend the Zhuxia!"
 EVTDESC908:0 "The Bazhu has rushed to aid $FROMCOUNTRY$ against a barbarian invasion!"
 EVTOPTA908:0 "As it should be!"
 EVTNAME909:0 "Dishonourable Bazhu"
 EVTDESC909:0 "The Bazhu has failed to defend $FROMCOUNTRY$ from a barbarian invasion."
 EVTOPTA909:0 "Dishonourable? I'd say it's prudent!"
 EVTNAME950:0 "Return of Lawful Territory"
 EVTDESC950:0 "The unlawfully taken province of $PROVINCENAME$ has been returned from $FROMCOUNTRY$ back into the Zhuxia. This honourable deed has not gone unnoticed."
