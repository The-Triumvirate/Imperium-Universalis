 HINT_HRE_TITLE:0 "Zhuxia"
 HINT_HRE_TEXT:0 "Zhuxia consisted of a number of Chinese states organized together. Zhuxia consists of Hegemon Bazhu and a number of influential Fang Bo. When the current Hegemon dies, a new Hegemon will be elected by the Fang Bo. Any attack on a member of the Zhuxia will give Hegemon the opportunity to interfere. Hegemons are obliged to protect Zhuxia members from the barbarians."
 HINT_EMPEROR_TITLE:0 "Zhuxia Bazhu"
 HINT_EMPEROR_TEXT:0 "The Bazhu is a ruler that gets elected when the old Bazhu dies. The Bazhu leads the Zhuxia and protects it against foreign threats. The Bazhu builds up Zhuxia Authority, which can be used to enact Zhuxia Reforms. Being the Bazhu has specific bonuses attached depending on how many Zhuxia Reforms have been enacted."
 HINT_ELECTOR_TITLE:0 "Fangbo"
 HINT_ELECTOR_TEXT:0 "The Zhuxia Bazhu is chosen by the Fangbo. The Zhuxia should have seven Fangbo and any less will cause the Bazhu to lose Zhuxia Authority. If a Fangbo country stops existing, the Bazhu may grant the title to a new country."
 HINT_IMPERIALAUTHORITY_TITLE:0 "Zhuxia Authority"
 HINT_IMPERIALAUTHORITY_TEXT:0 "Zhuxia Authority is necessary for the Bazhu of the Zhuxia to try to enact Zhuxia Reforms. High Zhuxia Authority will increase the probability of member countries voting in favor of a new Zhuxia's Reform. Zhuxia Authority is gained when the Bazhu maintains Great Unity in the Zhuxia and when he protects the Zhuxia from foreign aggressors."
