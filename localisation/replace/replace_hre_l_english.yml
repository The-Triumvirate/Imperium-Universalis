 hre_dominant_catholic:0 "LiYue-JiaoHua Community"
 desc_hre_dominant_catholic:0 "The LiYue-JiaoHua rite is the official religion of the Zhuxia. Following this rite grants our nation a certain moral legitimacy."
 hre_dominant_protestant:0 "LiYueBaDao Community"
 desc_hre_dominant_protestant:0 "The LiYue-BaDao rite is the official religion of the Zhuxia. Following this rite grants our nation a certain moral legitimacy."
 CANNOT_JOIN_LEAGUE_TRUCE_WITH_EMPEROR:0 "§R- We cannot join this League while we have a truce with the Bazhu.§!"
 EMPEROR_CANNOT_JOIN_LEAGUE:0 "§R- The Bazhu cannot join or leave a League.§!"
 NOT_DISCOVERED_HRE:0 "§R- We have not discovered the Zhuxia!§!"
 HRE_ON_OTHER_CONTINENT:0 "§R- We cannot join a League if our capital is on a different continent than the Zhuxia.§!"
 REMOVE_ELECTORATE_NO_OFFICIAL_RELIGION:0 "You cannot revoke electorates unless there is an official religion in the Zhuxia."
 MAPMODE_EMPIRE_DESC:0 "Colors the provinces that are part of the Zhuxia.\nPurple belongs to the Bazhu, brown belongs to the Fangbo, and blue belongs to the Shenshou. Green provinces are simply part of the Zhuxia.\nYellow-striped provinces are part of the Zhuxia, but their owner is not.\nOrange-striped provinces are part of the Zhuxia, but they are subject of a non-Zhuxia overlord.\n"
 DISMANTLE_HRE_PRESTIGE_DESC:0 "§G$VAL$§! prestige will be gained from dismantling the Zhuxia."
 EMPEROR_DIPACTIONS_DESC:0 "The Bazhu may take the following diplomatic actions:\n§YBestow Bazhu's Grace§!\n§YEnforce Great Unity§!\n§YGrant Fangbo Status§!\n§YGrant Shenshou Status§!\n§YDemand Unlawful Territory§!"
 HRE_OTHER_VOTE_SELF:0 "The Fangbo of §Y$ELECTOR$§W is backing themselves for the position of Bazhu."
 CURRENTLY_VOTING_FOR_SELF:0 "We are currently voting for ourselves."
 HRE_RELATION_SELF:0 "We give ourselves §Y$POINTS$§W when ranking of who we want to vote for as the next Bazhu."
 HRE_CAST_VOTE_DESC:0 "You can select who you want to vote for as Bazhu!"
 BENEFIT_FOR_EMPEROR:0 "Bazhu gets:\n$MODIFIER$"
 BENEFIT_FOR_MEMBER:0 "Zhuxia Members and Shenshou State get:\n$MODIFIER$"
 improved_imperial_relations:0 "Improved Zhuxia's relations"
 NO_WAR_ON_EMPIRE:0 "You cannot declare war on a member of the Zhuxia, if you are allied with the Bazhu in a war."
 NO_WAR_ON_EMPIRE_FIRST_MONTHS:0 "You cannot declare war on a member of the Zhuxia, if you are allied with the Bazhu and the Bazhu has recently gone to war."
 ALREADY_WAR_EMPIRE:0 "You cannot declare war on a member of the Zhuxia, if you are already at war with the Bazhu."
 PEACE_IN_EMPIRE_NO_WAR:0 "After the decree of Eternal Peace has been declared, no member of the Zhuxia may not take hostile actions towards another member."
 take_province_hre:0 "Attack the Zhuxia"
 take_province_hre_desc:0 "War goal is to take a province that is part of the Zhuxia."
 UNLAWFUL_TERRITORY_WARN:0 "§RUnlawful territory, the Bazhu may demand you to return it!§!"
 UNLAWFUL_TERRITORY_WARN_DELAY:0 "Since this province is part of the Zhuxia and not your core, it will be considered unlawful territory if you take it."
 GRANTFREECITYTITLE:0 "(DISABLED)"
 GRANTFREECITYDESC:0 "This option is disabled due to the usual option being un-moddable. Use the new option above to grant Shenshou status instead."
 REMOVE_FREECITY_TITLE:0 "Revoke Shenshou Status"
 REMOVE_FREECITY_DESC:0 "Revoking their Shenshou status will weaken their economy and reduce their contribution to the Bazhu, but we will no longer be required to protect them."
 GRANTELECTORATETITLE:0 "Grant Fangbo Status"
 GRANTELECTORATEDESC:0 "Granting Fangbo Status allows them to vote on who should be the Bazhu in the Zhuxia."
 REMOVE_ELECTORATE_TITLE:0 "Remove Fangbo"
 REMOVE_ELECTORATE_DESC:0 "Removing their Fangbo Status forbids them from voting who should be the Bazhu of the Zhuxia."
 REMOVE_ELECTORATE_ADDITIONAL_EFFECTS:0 "Furthermore, it would change other Fangbo' opinion of us by $SAME$ if same religion as the removed Fangbo, $OTHER$ if otherwise.\n\nIt will cost us §Y$IA$§! Zhuxia Authority."
 OPINION_WOULDCHANGEBY:0 "It would change their opinion of us by $AMOUNT$."
 DEMANDUNLAWFULTERRITORYTITLE:0 "Demand Unlawful Territory"
 DEMANDUNLAWFULTERRITORYDESC:0 "Demand the return of an unlawful territory to the Zhuxia."
 DEMANDUNLAWFULTERRITORY_DERIVEDDESC:0 "Demand the return of the unlawful territory '$PROV|Y$' to the Zhuxia."
 has_unlawful_territory:0 "Has Unlawful Territory modifier"
 HAS_NO_PROV_IN_EMPIRE_OR_LIBERATED:0 "Has no non-core province that is a part of the Zhuxia and that has not been liberated from a non-Zhuxia's country."
 RETURN_UNLAWFUL_NOT_OWN:0 "You can't return a province you don't own!"
 DIPLOMACYACTION_CATEGORY_emperor:0 "Bazhu Actions"
 GRANTELECTORATEREQDESC:0 "$ACTOR$ offers us a Fangbo Status position in the Zhuxia. By accepting we will be able to vote for the next Bazhu."
 GRANTFREECITYREQDESC:0 "$ACTOR$ offers us Shenshou status in the Zhuxia. If we accept, our government will change to a Shenshou State and the Bazhu will defend us from all aggressors. If we acquire more provinces or leave the Zhuxia we will lose our Shenshou State status."
 DEMANDUNLAWFULTERRITORYREQDESC:0 "The Bazhu $ACTOR$ demands that we return the province of '$PROV|Y$' to the Zhuxia. Denying this request will seriously impact our relation with the Zhuxia."
 DEMANDUNLAWFULTERRITORYREQDENYEFFECTS:0 "Declining will have the following effects:\nThe Bazhu will receive a casus belli against you.\nProvince effects:\n$PROVEFFECT$\n\nOpinion modifier from members of the Zhuxia:\n$OPINIONEFFECT$"
