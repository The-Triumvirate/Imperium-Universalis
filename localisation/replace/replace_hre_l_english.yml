 HRE_RELIGIOUS_WAR:0 "§YGreat War§!"
 MODIFIER_MAX_ELECTORS:0 "Number of Fangbo"
 HRE_RELIGIOUS_WAR_DESC:0 "The Zhuxia is in a state of great war between the LiYue-JiaoHua and LiYue-BaDao Leagues, the principle issue is whether or not to accept BaDao countries as legitimate hegemons. Should the JiaoHua League win, BaDao countries will not be allowed to become Bazhu. Should the BaDao League win, the Zhuhou will be forced to acknowledge their equal status."
 HRE_RELIGIOUS_PEACE:0 "§YGreat Peace§!"
 HRE_RELIGIOUS_PEACE_DESC:0 "The Zhuxia is currently at peace, and the issue of BaDao inclusion is settled for now. However, it may be brought up again in the future by the losing side of the previous League War."
 HRE_OFFICIAL_RELIGION:0 "§Y$RELIGION$§! is the Dominant Rite"
 HRE_OFFICIAL_RELIGION_DESC:0 "§Y$RELIGION$§! is the dominant rite of the Zhuxia. Only §Y$RELIGION$§! rulers are eligible to become Bazhu."
 HRE_PERMANENT_RELIGION:0 "§Y$RELIGION$§! is the Official Rite"
 HRE_PERMANENT_RELIGION_DESC:0 "§Y$RELIGION$§! is the official rite of the Zhuxia. Only §Y$RELIGION$§! rulers are eligible to become Bazhu and all Fangbo must be §Y$RELIGION$§! as well. The Bazhu may use the Enforce Great Unity diplomatic action on member states of a different rite."
 HRE_LEAGUE_MEMBER:0 "§Y$COUNTRY$§! is a member of §YThe $RELIGION$ League§!."
 HRE_LEAGUE_LEADER:0 "§Y$COUNTRY$§! is the leader of §YThe $RELIGION$ League§!."
 HRE_LEAGUES_ENABLED:0 "The §YLiYue-BaDao§! and §YLiYue-JiaoHua§! Leagues are enabled."
 HRE_LEAGUES_DISABLED:0 "The §YLiYueBaDao§! and §YLiYueJiaoHua§! Leagues are NOT enabled."
 HRE_RELIGION_LOCKED:0 "The Zhuxia has an official, unchangeable rite."
 HRE_RELIGION_UNLOCKED:0 "The Zhuxia does NOT have an official, unchangeable rite."
 HRE_RELIGION_TREATY:0 "The Zhuxia has a Treaty of Great Peace."
