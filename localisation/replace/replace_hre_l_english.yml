 emperor_per_prince_modifier:0 "Members of the Zhuxia"
 hre_event.7.d:0 "From today onwards, the many lords of the Zhuxia have agreed to routinely gather at [From.GetCapitalName] to try and settle disputes among one another, discuss government policy, and to create and uphold covenants. Such a thing was previously hard to conceive of, but the continued dominance of the Hegemon has led to an increased level of centralization among the former Zhou states. Should this city be captured by foreign enemy forces, the authority of the Hegemon would be greatly hampered."
 hre_event.7.a:0 "For the continued peace and prosperity of the Zhuxia."
 desc_perpetual_diet:0 "The many lords are routinely gathering at this city to pay their respects to the Bazhu and to discuss the most pressing matters of the day amongst themselves. Such a development shows the growing centralization of the Zhuxia under the authority of the Hegemon.\n§YThe capture of this city by the enemy forces would seriously undermine the authority of the Hegemon.§!\n"
 diet_occupied:0 "Assembly City Occupied"
 desc_diet_occupied:0 "The Assembly City of the Zhuxia is being occupied by a foreign enemy, greatly hurting the Bazhu's authority.
 IMPERIALREALMWARTITLE:0 "Zhuxia Punitive War"
 IMPERIALREALMWARDESC:0 "Do you want to start a war against $COUNTRY|Y$? This will cost $COST|Y$ points of Zhuxia prestige, but gives us a 5 year reason to declare war on $COUNTRY|Y$, a reason that will allow us to rally the power of the whole Zhuxia."
