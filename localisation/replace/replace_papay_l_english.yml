 taoism_events.81.t:0 "Measuring the Silhouette of Luoyang"
 taoism_events.81.d:0 "The ruler who brings eternal peace should sit in the center of the world. Where is this central place? It is Luoyang. Although some people disagree, the results measured in Luoyang show that there will be no shadows here, indicating the correctness of the judgment."
 taoism_events.81.a:0 "Good"
 taoism_events.82.t:0 "The yellow flag that appeared in Luoyang"
 taoism_events.82.d:0 "After revealing the fact that Luoyang had no shadow, yellow flags appeared in the Luoshui surrounding Luoyang, and purple canopies appeared in the Yellow River. This was the order of God."
 taoism_events.82.a:0 "Mandate of Heaven"
 taoism_events.83.t:0 "Huangdi's Origin in Zhen"
 taoism_events.83.d:0 "The Emperor emerges from Zhen, and all things also emerge from Zhen. Therefore, he is the first among all things to emerge. Zhen means origin, which means that the Qian Yuan (Heavenly Origin) uses nine to govern the world, hence all nations enjoy peace."
 taoism_events.83.a:0 "Everthing is Heaven"
 taoism_events.84.t:0 "Chen-Wei"
 taoism_events.84.d:0 "Chen Book, Wei Picture, they are records of mysterious prophecies:\n"$DYNASTY$ [Root.Monarch.GetName] will launch a war to destroy those who violate the laws of heaven, barbarians from all quarters shall gather, and dragons will fight in the wild - [Root.Country.GetName] will become ruler on the juncture of the fourth and seventh.\n"Where is the Tianzi? Indeed, he is near $CAPITAL$."\nThe Five Emperors and Three Sovereigns received the mandate, and now the lord of [Root.Country.GetName] shall hold it too.""
 taoism_events.84.a:0 "It's ME!"
 taoism_events.85.t:0 "Auspicious Signs"
 taoism_events.85.d:0 "Dragon, Feng, Ling Turtle, White Tiger, Qilin, Golden Harvest... Many auspicious signs appeared in various places, and there are few repetitions. Great peace and order shall spread throughout the land!"
 taoism_events.85.a:0 "Everything is coming together..."
 taoism_events.86.t:0 "Projected Calendar"
 taoism_events.86.d:0 "When will permanent peace come? It is said: The Mandate shall change in the year of Xinyou, and Decrees will come in the year of Jiazi. In order to time this accurately, the calendar must be reformed."
 taoism_events.86.a:0 "Do so reverently"
 taoism_events.87.t:0 "Taiping Heavenly Kingdom"
 taoism_events.87.d:0 "Everlasting peace is coming! My realm is truly the Taiping Heavenly Kingdom!"
 taoism_events.87.a:0 "I am the True Lord of Great Peace!"
 taoism_events.87.b:0 "Only our Chosen People can live in this world!"
