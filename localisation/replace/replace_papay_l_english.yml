 taoism_events.21.t:0 "Collect the Classics"
 taoism_events.21.d:0 "Since the legendary Cangjie invented writing, countless people throughout history have created important texts and documents for the Xia, Shang, and Zhou. The Zhou kings kept the classics in the capital and retained ancient knowledge, but because of wars and chaos, their teachings were spread throughout various places. The classics should be collected and edited."
 taoism_events.21.a:0 "Allocate funds to make our own copies"
 taoism_events.21.b:0 "Force the people to send their copies to our court"
 taoism_events.22.t:0 "Organize the Classics"
 taoism_events.22.d:0 "Copies of the classics have been sent to the capital, but these copies should be copied again in case they are destroyed. However, at present we often create copies on slips made of wood or bamboo. This is very inconvenient. How should we deal with this problem?"
 taoism_events.22.a:0 "Hire more scribes"
 taoism_events.22.b:0 "Order the invention of a lighter writing material"
 taoism_events.23.t:0 "The Invention of Paper"
 taoism_events.23.d:0 "With the continuous efforts of our officials, a lightweight writing material was produced. It is as light and thin as silk, but it is made of cheap materials such as bark, broken fishnets, rags, and hemp. It has been dubbed "Paper.""
 taoism_events.23.a:0 "Excellent!"
 taoism_events.24.t:0 "Complete Collection"
 taoism_events.24.d:0 "After several years of hard work, a collection of the classics has finally been completed. It contains hundreds of articles spanning generations of history, which can be described as the crystallization of civilization. How should these classics be treated?"
 taoism_events.24.a:0 "Make a simple version and send it to various localities"
 taoism_events.24.b:0 "Display it in the court"
 taoism_events.24.c:0 "Send summaries to the provinces, and covertly keep a copy in the palace."
