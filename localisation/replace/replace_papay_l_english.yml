 taoism_events.61.t:0 "Mission to Locate Xians"
 taoism_events.61.d:0 "It is said that \"Xians\" lives in deep mountains and vast forests, or overseas islands. They are immortal and possess power and wisdom beyond human beings. If they can be found, all doubts and wishes will be answered. But where would we find them?"
 taoism_events.61.a:0 "Locate Xian on Land"
 taoism_events.61.b:0 "Locate Xian Overseas"
 taoism_events.61.c:0 "End this Nonsenical Mission!"
 taoism_events.61.e:0 "No longer Locate Xian"
 taoism_events.62.t:0 "Locate Xian on Land"
 taoism_events.62.d:0 "This is expected to take about three years."
 taoism_events.62.a:0 "Go to the mountains"
 taoism_events.62.b:0 "Go to the forests"
 taoism_events.62.c:0 "Go to the deserts"
 taoism_events.63.t:0 "Locate Xian Overseas"
 taoism_events.63.d:0 "This is expected to take about three years."
 taoism_events.63.a:0 "Go to East Sea"
 taoism_events.63.b:0 "Go to South Sea"
 taoism_events.63.c:0 "Go to West Sea"
 taoism_events.63.e:0 "Go to North Sea"
 taoism_events.64.t:0 "Located Xian!"
 taoism_events.64.d:0 "The expedition team reported that they finally found a Xian and asked for further instructions."
 taoism_events.64.a:0 "Any advice?"
 taoism_events.65.t:0 "Failed to Locate Xian"
 taoism_events.65.d:0 "Our expedition traversed all corners of the world, but still did not locate any Xian."
 taoism_events.65.a:0 "Conmen!"
 taoism_events.66.t:0 "Mountain Report"
 taoism_events.66.d:0 "Our expedition did not locate any Xian in the mountains."
 taoism_events.66.a:0 "Keep trying"
 taoism_events.67.t:0 "Forest Report"
 taoism_events.67.d:0 "Our expedition did not locate any Xian in the forests."
 taoism_events.67.a:0 "Keep trying"
 taoism_events.68.t:0 "Desert Report"
 taoism_events.68.d:0 "Our expedition did not locate any Xian in the desert."
 taoism_events.68.a:0 "Keep trying"
 taoism_events.69.t:0 "East Sea Report"
 taoism_events.69.d:0 "Our expedition did not locate any Xian in the East Sea."
 taoism_events.69.a:0 "Keep trying"
 taoism_events.70.t:0 "South Sea Report"
 taoism_events.70.d:0 "Our expedition did not locate any Xian in the South Sea."
 taoism_events.70.a:0 "Keep trying"
 taoism_events.71.t:0 "West Sea Report"
 taoism_events.71.d:0 "Our expedition did not locate any Xian in the West Sea."
 taoism_events.71.a:0 "Keep trying"
 taoism_events.72.t:0 "North Sea Report"
 taoism_events.72.d:0 "Our expedition did not locate any Xian in the North Sea."
 taoism_events.72.a:0 "Keep trying"
 taoism_events.73.t:0 "Hermit's Guidance"
 taoism_events.73.d:0 "After repeated confirmation, it turns out that our expedition did not, in fact, locate a Xian, but instead a hermit full of wisdom. The way of governing a country taught by him was recorded."
 taoism_events.73.a:0 "So, there are no Xian in this world?"
 taoism_events.74.t:0 "Faux Xian"
 taoism_events.74.d:0 "Under investigation, the Xian they brought back was actually just some barbarian who didn't understand our language. They have been sent to prison."
 taoism_events.74.a:0 "It makes no sense to locate Xian..."
 taoism_events.75.t:0 "A True Xian"
 taoism_events.75.d:0 "The expedition team brought back a Heavenly Book given by a Xian. It is made of indescribable materials. When it was unfolded, astronomy, geography, and every piece of knowledge in the universe began unfolding in front of our lord's eyes, soon... immediately...!"
 taoism_events.75.a:0 "I'm beginning to understand... everything..."
