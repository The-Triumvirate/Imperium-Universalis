 taoism_events.41.t:0 "Organized Religious Communities"
 taoism_events.41.d:0 "Since the world has fallen into chaos, scholars have created their own doctrines and recruited disciples, though this is only an academic relationship. After contact with Western beliefs, religious societies with distinct levels and hierarchies have become popular."
 taoism_events.41.a:0 "Stop this at once!"
 taoism_events.41.b:0 "Allow these Communities to continue"
 taoism_incident_jiaoshe.tt:0 "The consequences of this are unpredictable..."
 taoism_incident_jiaoshe_TWO.tt:0 "These communities will continue to spread until they reach our capital..."
 taoism_events.42.t:0 "Speard of Religious Communities"
 taoism_events.42.d:0 "Some Taoist priests and believers formed communities in more detailed ways, each bestowing titles such as libationer, chief minister, and ghost warrior, as well as dividing their dioceses by region, which can be regarded as a new way of spreading the word."
 taoism_events.42.a:0 "Concerning..."
 taoism_events.42.b:0 "Timely processing"
 taoism_events.43.t:0 "Management of Religious Communities"
 taoism_events.43.d:0 "Having gone through turmoil, the advantages and disadvantages of these novel religious communities are self-evident. Eliminating them or allowing them to run rampant may come with disadvantages. Perhaps there's a more moderate option?"
 taoism_events.43.a:0 "Eliminate the Communities"
 taoism_events.43.b:0 "Allow them to exist freely"
 taoism_events.43.c:0 "Regulate them to prevent more chaos"
