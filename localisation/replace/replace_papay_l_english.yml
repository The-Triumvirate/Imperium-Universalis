 taoism_huanglao_1:0 "Not to interfere with the people"
 desc_taoism_huanglao_1:0 "No more large-scale mobilization and let the people develop."
 taoism_huanglao_2:0 "Reduce the people’s taxation and manpower use"
 desc_taoism_huanglao_2:0 "Reduce taxation and manpower collection to ensure people's livelihood."
 taoism_huanglao_3:0 "Advocate saving and reducing expenditures"
 desc_taoism_huanglao_3:0 "Promote life saving and no extravagance and waste."
