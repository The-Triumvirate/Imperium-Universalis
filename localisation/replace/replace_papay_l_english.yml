 bianshen_han_desc:0 "The lord of Fan once had a dream - dreaming that he was walking in the void, roaming the universe, shuttling in the Milky Way (TianHan), and overlooking the earth from afar. Everything seemed to be within his grasp - Heaven has ordered the Fan clan to be kings of Han!"