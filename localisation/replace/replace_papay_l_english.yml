 taoism_events.31.t:0 "Witchcraft Incites Interest in the Capital"
 taoism_events.31.d:0 "It is rumored that an extraordinary wizard appeared in $CAPITAL$. He can disappear in public and then reappear, or allow ghosts and gods to descend to his body and convey prophecies, and even make the souls of the dead appear again. Many high-ranking officials and dignitaries visit him frequently."
 taoism_events.31.a:0 "Summon him"
 taoism_events.31.b:0 "Expel him!"
 taoism_incident_wuyi.tt:0 "Witchcraft is introduced into the palace"
 taoism_events.32.t:0 "Witchcraft Panic"
 taoism_events.32.d:0 "According to an official’s secret report, they found that our heir [Root.Heir.GetName] has often carried out deceptive activities at night. After investigation, it was discovered that he had placed a large number of dolls cursing our $MONARCHTITLE$ in his bedroom. He intends to harm his own father!"
 taoism_events.32.a:0 "[Root.Monarch.GetName]'s Guards will handle this..."
 taoism_events.32.b:0 "Arrest [Root.Heir.GetName]!"
 taoism_events.33.t:0 "Witchcraft to Cure Ullness"
 taoism_events.33.d:0 "Due to the preferential treatment of wizards by our $MONARCHTITLE$, those who openly use witchcraft to heal diseases have appeared everywhere, and even made statements that incited the people. These healers have gathered a large number of roaming followers..."
 taoism_events.33.a:0 "Arrest them at once!"
 taoism_events.33.b:0 "They are too influential."
 taoism_incident_wuist_rebel_tt:0 "Wuist rebels will rise up in every Taoist province you own (except your capital)."
 taoism_events.34.t:0 "How to Handle Witchcraft?"
 taoism_events.34.d:0 "After the crisis between the court and the public, we have gained a new understanding of the role of witchcraft. Witchcraft may not attract gods or reappear the souls of the dead, but it can affect people's hearts and make people fear or believe in the actions of its practitioners. It should be handled in a suitable way."
 taoism_events.34.a:0 "Allow Some Witchcraft"
 taoism_events.34.b:0 "Ban All Witchcraft"
