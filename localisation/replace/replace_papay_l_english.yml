 bazhu_end_war_tooltip:0 "Force this country to stop war with countries of the same religion to him"
 bazhu_end_war_desc:0 "As Bazhu, there is an obligation to ask all the countries of the Zhuxia to maintain peace and not engage in civil war."
 bazhu_end_war_dialog:0 "[This.GetName] require us stop war with the coutries who have same religion to us"
 bazhu_end_war_tt:0 "Forced stop war"
 ShiJian.25.t:0 "Bazhu is stop our war"
 ShiJian.25.d:0 "envoy of Bazhu require we stop war with other coutries who have same religion to us."
 EVTOPTAShiJian.25.a:0 "Have to agree"
 zhanguokaishi:0 "Warring States Period"
 free_city:0 "Shenshou State"
 free_city_desc:0 ""Shenshou" represents a state that exists to act as a guardian to the local spirits of their domain. They do not hold any ambition, and so they are put under the direct protection of the Bazhu."
 MOHISM_ASPECTS_LONG:0 "Doctrines of Mohism"
 MOHISM_ASPECTS_SHORT:0 "Doctrine"
 taoism_events.1.t:0 "Rest and Recuperate"
 taoism_events.1.d:0 "Our country has just experienced war, and the people's livelihood is devastated. A group who call themselves practitioners of Huanglao Thought proposed to our $MONARCHTITLE$ that we should be governed according to the teachings of Huangdi and Laozi. These teachings include three major policies: allowing the people to rest, reducing taxes and levies, and practicing frugality and tranquility. The implementation of these policies should be based on different emphases."
 taoism_events.1.a:0 "Allow the People to Rest"
 taoism_events.1.b:0 "Reduce Taxation and Levies"
 taoism_events.1.c:0 "Advocate Frugality"
 taoism_events.2.t:0 "National Prosperity"
 taoism_events.2.d:0 "Now that our country has experienced peace, our population has grown and the people are living happily, which may allow us to carry out large-scale projects."
 taoism_events.2.a:0 "Construct Public Facilities"
 taoism_events.2.b:0 "Build a Magnificent Palace"
 taoism_events.3.t:0 "Way of Governance"
 taoism_events.3.d:0 "Huanglao's school of thought proved to be effective, but it has sparked controversy as to whether or not Huangdi or Laozi takes priority."
 taoism_events.3.a:0 "Practice the Art of August Governance"
 taoism_events.3.b:0 "Promote a Small Country with Few People"
 taoism_events.3.c:0 "Both are important!"
