 taoism_events.51.t:0 "Creation of an Elixir"
 taoism_events.51.d:0 "A group of alchemists asked our $MONARCHTITLE$ for funding to create an elixir, claiming that this would make $MONARCHTITLE$ immortal."
 taoism_events.51.a:0 "Granted!"
 taoism_events.51.b:0 "Not yet..."
 taoism_events.52.t:0 "Materials for the Elixir"
 taoism_events.52.d:0 "Our $MONARCHTITLE$ visited the alchemy room, and preparations have been completed. What materials should be used?"
 taoism_events.52.a:0 "Minerals"
 taoism_events.52.b:0 "Herbs"
 taoism_events.52.c:0 "Animals"
 taoism_events.53.t:0 "Alchemy Facility Exploded!"
 taoism_events.53.d:0 "While our $MONARCHTITLE$ was dealing with government affairs, a loud noise was suddenly heard coming from the alchemy room. [Root.Monarch.GetName] panicked and ordered the alchemists to be summoned. Fortunately, no one died. Alchemists stood on the left and right, whispering to each other, waiting for the decision of our lord."
 taoism_events.53.a:0 "The reason behind it is worth exploring..."
 taoism_events.53.b:0 "Don’t care, refine the elixir!"
 taoism_events.54.t:0 "Gunpowder"
 taoism_events.54.d:0 "An alchemist rushed into the palace of [Root.Monarch.GetTitle] [Root.Monarch.GetName] excitedly. Although the guards stopped him, he still couldn't change his fanatical look. He shouted loudly, saying that he had discovered a brand new material, which is black powder that can burn quickly and can cause an explosion in a closed environment!"
 taoism_events.54.a:0 "Will this change the world?"
 taoism_events.55.t:0 "Development of an Elixir"
 taoism_events.55.d:0 "After several setbacks, an elixir was finally developed. The alchemists put it in a jade brocade box, and so our $MONARCHTITLE$ prepared and opened the box in a secret room at the right time. In the center of the box is a sphere with a shining strange light, which is tempting yet frightening."
 taoism_events.55.a:0 "Eat it, it is Heaven’s will."
