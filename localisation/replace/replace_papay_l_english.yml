 taoism_events.11.t:0 "Mysterious Circulations"
 taoism_events.11.d:0 "Some rather mysterious remarks have begun to spread in Qingzhou, involving the exploration of the origin and composition of the world in which we live, which is unprecedented thought."
 taoism_events.11.a:0 "Wait and observe..."
 taoism_events.12.t:0 "Yinyang Theory"
 taoism_events.12.d:0 "Some scholars have promoted the old Yin and Yang theory, dividing everything in the world into yin and yang, the two exist without separation; it is very important to maintain a balance between them. They also believe that the world’s chaotic cycle is due to the imbalance between Yin and Yang. Currently, does the world have an excess of Yin, or Yang?"
 taoism_events.12.a:0 "Excess Yin"
 taoism_events.12.b:0 "Excess Yang"
 taoism_events.13.t:0 "Five Elements Theory"
 taoism_events.13.d:0 "A doctrine called the \"Five Elements\" has begun to spread. It proposes that the world is composed of five elements: Jin (metal), Mu (wood), Shui (water), Huo (fire), and Tu (earth). Even conceptual existences such as the seasons also have characteristics of these elements. This doctrine can be used to explain that the change of dynasties is precisely caused by the intergeneration or restraint of the five elements. What is the element our dynasty?"
 taoism_events.13.a:0 "Element of Fire"
 taoism_events.13.b:0 "Element of Water"
 taoism_events.13.c:0 "Element of Wood"
 taoism_events.13.e:0 "Element of Earth"
 taoism_events.13.f:0 "Element of Metal"
 taoism_events.14.t:0 "Yinyang or the Five Elements"
 taoism_events.14.d:0 "Both Yinyang and the Five Elements theories have their place in our country, but the two factions often bicker over orthodoxy status. There are discussions happening from our court to the public, and it is time that our $MONARCHTITLE$ decides which is supreme."
 taoism_events.14.a:0 "Five Elements Rebirth"
 taoism_events.14.b:0 "Continue the Dualistic Tradition"
 taoism_events.14.c:0 "Keep the World in Balance"
 taoism_events.14.c:0 "Chaos and Order Alternate"
 taoism_incident_reduce_nationalism_tt:0 "All provinces will lose 10 years of separatism."
